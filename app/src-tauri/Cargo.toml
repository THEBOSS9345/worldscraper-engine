[package]
name = "worldscraper"
version = "0.1.0"
description = "WorldScraper — planetary-scale crawler with a live search index"
authors = ["WorldScraper"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "worldscraper_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Search index. Tantivy is the reason the Rust side exists: it is the only
# embedded engine here that stays fast past a hundred million documents.
tantivy = "0.26"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }

anyhow = "1"
thiserror = "2"
url = "2"
log = "0.4"
rand = "0.9"
dirs = "6"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
# Deliberately not panic = "abort": a panic in an index or supervisor thread
# should unwind and be recovered from, not take the whole app down.
